aid: citizen
name: Citizen
description: Citizen is a consumer public-safety mobile application that delivers real-time,
  location-based safety alerts and incident notifications to users about events happening in
  their communities. The app surfaces verified alerts, live video streamed by witnesses at the
  scene, incident search, and community broadcast features to help people connect and stay safe.
  Backed by 8vc, Citizen positions itself as the leading public-safety app in the United States.
  It is a consumer product with no public developer program, API documentation, SDK, or developer
  portal exposed on its website as of this enrichment pass.
